spring.application.name=support-agent

# Flyway owns the schema; Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# See the SQL you're generating while learning
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=debug

# So /actuator/health shows the database component
management.endpoint.health.show-details=always

# ── AI ──────────────────────────────────────────
# API key comes from the SPRING_AI_GOOGLE_GENAI_API_KEY env var
spring.ai.google.genai.chat.model=gemini-3.6-flash
spring.ai.google.genai.chat.temperature=0.2
# Embedding model reads its own prefix; wire it to the same env var
spring.ai.google.genai.embedding.api-key=${SPRING_AI_GOOGLE_GENAI_API_KEY}

spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=768

# ── Vector Store (pgvector) ────────────────────
# Must match the embedding model's reduced output (768) or the HNSW
# index fails (pgvector caps HNSW at 2000 dims)
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.initialize-schema=true

# ── Local Postgres (compose.yaml values; image isn't auto-detected) ──
spring.datasource.url=jdbc:postgresql://localhost:5432/support_agent
spring.datasource.username=support_agent
spring.datasource.password=secret