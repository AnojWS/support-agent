spring.application.name=support-agent

# Flyway owns the schema; Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# See the SQL you're generating while learning
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=debug

# So /actuator/health shows the database component
management.endpoint.health.show-details=always

# ── AI ──────────────────────────────────────────
# API key comes from the SPRING_AI_GOOGLE_GENAI_API_KEY env var
spring.ai.google.genai.chat.model=gemini-2.5-flash
spring.ai.google.genai.chat.temperature=0.2